<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContactHub | Registro de Contactos</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="encabezado">
      <div class="contenedor">
        <h1>ContactHub</h1>
        <p>Laboratorio 09A | Registro de Contactos PHP</p>
      </div>
    </header>

    <main class="contenedor">
      <section class="tarjeta">
        <h2>Nuevo contacto</h2>
        <p class="subtitulo">Completa los campos para registrar un contacto.</p>

        <form action="registro.php" method="POST">
          <div class="campo">
            <label for="nombre"> Nombre completo </label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej. Ana Perez"
              maxlength="100"
              required
            />
          </div>

          <div class="campo">
            <label for="correo"> Correo electrónico </label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="Ej. ana@correo.com"
              maxlength="254"
              required
            />
          </div>

          <button type="submit" class="boton">+ Registrar contacto</button>
        </form>
      </section>
    </main>

    <footer class="pie">
      Ramos Tacza Camilda_Torres Ambrosio Katherine Medally - Semana 09
    </footer>
  </body>
</html>
